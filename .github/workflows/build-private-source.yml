{
  "name": "Build MGControl from private source",
  "on": {
    "workflow_dispatch": {},
    "push": {
      "branches": [
        "main"
      ],
      "paths": [
        ".github/workflows/build-private-source.yml"
      ]
    }
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "mgcontrol-private-source-build",
    "cancel-in-progress": true
  },
  "jobs": {
    "build": {
      "if": "github.repository == 'alanpfx/MGControl-Public' && github.ref == 'refs/heads/main' && github.actor == 'alanpfx'",
      "runs-on": "macos-15",
      "timeout-minutes": 40,
      "env": {
        "DEVELOPER_DIR": "/Applications/Xcode_16.4.app/Contents/Developer",
        "EXPECTED_APP_VERSION": "0.59",
        "EXPECTED_APP_BUILD": "43"
      },
      "steps": [
        {
          "name": "Check private source credential",
          "env": {
            "SOURCE_TOKEN": "${{ secrets.MGCONTROL_SOURCE_TOKEN }}"
          },
          "shell": "bash",
          "run": "if [ -z \"$SOURCE_TOKEN\" ]; then echo \"::error::Configure MGCONTROL_SOURCE_TOKEN with read-only Contents access to MGControl.\"; exit 1; fi"
        },
        {
          "name": "Read public build support",
          "uses": "actions/checkout@v6",
          "with": {
            "persist-credentials": false,
            "path": "public-build"
          }
        },
        {
          "name": "Read pinned private source",
          "uses": "actions/checkout@v6",
          "with": {
            "repository": "alanpfx/MGControl",
            "ref": "3019ba588fd8ea8fab5dc18ed7947dc2110615a9",
            "token": "${{ secrets.MGCONTROL_SOURCE_TOKEN }}",
            "persist-credentials": false,
            "path": "_private/source",
            "fetch-depth": 1
          }
        },
        {
          "name": "Test and build without exposing source logs",
          "shell": "bash",
          "run": "bash public-build/build-support/build.sh"
        },
        {
          "name": "Upload verified unsigned installers",
          "uses": "actions/upload-artifact@v4",
          "with": {
            "name": "MGControl-0.59-unsigned",
            "path": "public-output/installers/",
            "if-no-files-found": "error",
            "retention-days": 7
          }
        },
        {
          "name": "Encrypt build diagnostics",
          "if": "always()",
          "shell": "bash",
          "run": "bash public-build/build-support/encrypt-diagnostics.sh"
        },
        {
          "name": "Upload encrypted diagnostics",
          "if": "always()",
          "uses": "actions/upload-artifact@v4",
          "with": {
            "name": "MGControl-0.59-encrypted-diagnostics",
            "path": "public-output/diagnostics/build-logs.p7m",
            "if-no-files-found": "ignore",
            "retention-days": 3
          }
        }
      ]
    }
  }
}
