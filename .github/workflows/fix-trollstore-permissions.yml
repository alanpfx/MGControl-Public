{
  "name": "Repair TrollStore IPA permissions",
  "on": {
    "workflow_dispatch": {},
    "push": {
      "branches": [
        "main"
      ],
      "paths": [
        ".github/workflows/fix-trollstore-permissions.yml"
      ]
    }
  },
  "permissions": {
    "contents": "write"
  },
  "jobs": {
    "repair": {
      "if": "github.repository == 'alanpfx/MGControl-Public' && github.ref == 'refs/heads/main' && github.actor == 'alanpfx'",
      "runs-on": "ubuntu-latest",
      "steps": [
        {
          "uses": "actions/checkout@v6",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "name": "Verify and publish permission-only repair",
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          },
          "run": "python3 build-support/repair-trollstore.py"
        },
        {
          "uses": "actions/upload-artifact@v4",
          "with": {
            "name": "MGControl-0.60-trollstore",
            "path": "ts-output/",
            "retention-days": 7
          }
        }
      ]
    }
  }
}