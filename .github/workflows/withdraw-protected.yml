name: Withdraw legacy protected resources
# Include the separate TrollStore packaging artifacts in the scoped resource audit.
on:
  push:
    branches: [main]
    paths: [.github/workflows/withdraw-protected.yml]
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: mgcontrol-resource-withdrawal
  cancel-in-progress: false
jobs:
  withdraw:
    if: github.repository == 'alanpfx/MGControl-Public' && github.ref == 'refs/heads/main' && github.actor == 'alanpfx'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Withdraw scoped releases and protected public artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 build-support/withdraw-protected.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MGControl-privacy-withdrawal-report
          path: privacy-output/withdrawal-report.json
          retention-days: 30
