{
  "name": "Apply non-commercial agreement and requested private visibility",
  "on": {
    "push": {
      "branches": [
        "main"
      ],
      "paths": [
        ".github/workflows/license-v052.yml"
      ]
    }
  },
  "permissions": {
    "contents": "write"
  },
  "jobs": {
    "finish": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 10,
      "steps": [
        {
          "uses": "actions/github-script@v8",
          "with": {
            "script": "const crypto=require('crypto');\nconst sourceTree='f9060660a3d6bf2d936d349ddcc2ff394645f5b6';\nconst head=(await github.rest.git.getRef({...context.repo,ref:'heads/main'})).data.object.sha;\nif(head!==context.sha)throw new Error('Main changed; refusing to overwrite user changes');\nconst checked=(await github.rest.git.getTree({...context.repo,tree_sha:sourceTree,recursive:'true'})).data;\nconst files=checked.tree.filter(x=>x.type==='blob');\nif(checked.truncated || files.length!==38 || !files.some(x=>x.path==='LICENSE'))throw new Error('License snapshot mismatch');\nconst clean=(await github.rest.git.createCommit({...context.repo,message:'Keep reviewed source and non-commercial agreement in release snapshot',tree:sourceTree,parents:[head]})).data;\nawait github.rest.git.updateRef({...context.repo,ref:'heads/main',sha:clean.sha,force:false});\n// Fast-forward the source tag to include the agreement. Installer bytes are unchanged.\nawait github.rest.git.updateRef({...context.repo,ref:'tags/v0.52',sha:clean.sha,force:false});\nconst release=(await github.rest.repos.getReleaseByTag({...context.repo,tag:'v0.52'})).data;\nconst note=files.find(x=>x.path==='RELEASE-NOTES.md'),license=files.find(x=>x.path==='LICENSE');\nconst notesBlob=(await github.rest.git.getBlob({...context.repo,file_sha:note.sha})).data;\nconst licenseBlob=(await github.rest.git.getBlob({...context.repo,file_sha:license.sha})).data;\nconst data=Buffer.from(licenseBlob.content,'base64');\nif(release.assets.some(x=>x.name==='LICENSE.txt'))throw new Error('License asset exists; refusing to overwrite');\nconst asset=(await github.rest.repos.uploadReleaseAsset({...context.repo,release_id:release.id,name:'LICENSE.txt',data,headers:{'content-type':'text/plain; charset=utf-8','content-length':data.length}})).data;\nif(asset.size!==data.length || (asset.digest && asset.digest!=='sha256:'+crypto.createHash('sha256').update(data).digest('hex')))throw new Error('License asset mismatch');\nconst nl=String.fromCharCode(10);\nconst body=Buffer.from(notesBlob.content,'base64').toString('utf8')+nl+nl+'文档与非商业协议已更新；安装包仍为 0.52（36），未修改二进制。'+nl+'[严禁营利性与商业性使用协议](https://github.com/alanpfx/MGControl-Public/blob/main/LICENSE) · [安装说明](https://github.com/alanpfx/MGControl-Public/blob/main/docs/INSTALL.md)';\nawait github.rest.repos.updateRelease({...context.repo,release_id:release.id,body,target_commitish:clean.sha});\ncore.info('Source, release notes, source tag and LICENSE.txt updated; installer hashes unchanged.');\n// Owner explicitly requested private visibility after all uploads.\ntry {\n const repo=(await github.rest.repos.get(context.repo)).data;\n if(repo.private) {core.info('Repository is already private.');return;}\n const updated=(await github.rest.repos.update({...context.repo,private:true})).data;\n if(!updated.private)throw new Error('Private visibility not confirmed');\n core.info('Repository is now private.');\n} catch(e) {\n core.setFailed('Uploads completed. Owner action required to set repository private; API status '+(e.status || 'unknown')+'.');\n}\n"
          }
        }
      ]
    }
  }
}

