{
  "name": "Review private MGControl source",
  "on": {
    "workflow_dispatch": {},
    "push": {
      "branches": [
        "main"
      ],
      "paths": [
        ".github/workflows/review-private-source.yml",
        "build-support/review.sh",
        "build-support/review-results.py",
        "build-support/test_review_results.py"
      ]
    }
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "mgcontrol-private-source-review",
    "cancel-in-progress": true
  },
  "jobs": {
    "review": {
      "if": "github.repository == 'alanpfx/MGControl-Public' && github.ref == 'refs/heads/main' && github.actor == 'alanpfx'",
      "runs-on": "macos-15",
      "timeout-minutes": 40,
      "env": {
        "DEVELOPER_DIR": "/Applications/Xcode_26.3.app/Contents/Developer",
        "REVIEW_SOURCE_SHA": "024cb5a3c3130e7d876c13e11dfd8801f4932f91"
      },
      "steps": [
        {
          "name": "Check private source credential",
          "env": {
            "SOURCE_TOKEN": "${{ secrets.MGCONTROL_SOURCE_TOKEN }}"
          },
          "shell": "bash",
          "run": "if [ -z \"$SOURCE_TOKEN\" ]; then echo \"::error::Configure MGCONTROL_SOURCE_TOKEN with read-only Contents access to MGControl.\"; exit 1; fi"
        },
        {
          "name": "Read reviewed public support",
          "uses": "actions/checkout@v6",
          "with": {
            "persist-credentials": false,
            "path": "public-build"
          }
        },
        {
          "name": "Read immutable private test source",
          "uses": "actions/checkout@v6",
          "with": {
            "repository": "alanpfx/MGControl",
            "ref": "${{ env.REVIEW_SOURCE_SHA }}",
            "token": "${{ secrets.MGCONTROL_SOURCE_TOKEN }}",
            "persist-credentials": false,
            "path": "_private/source",
            "fetch-depth": 1
          }
        },
        {
          "name": "Run native checks with private diagnostics",
          "run": "bash public-build/build-support/review.sh"
        },
        {
          "name": "Upload numeric review result",
          "uses": "actions/upload-artifact@v4",
          "with": {
            "name": "MGControl-native-review-summary",
            "path": "public-output/review/summary.json",
            "if-no-files-found": "error",
            "retention-days": 3
          }
        },
        {
          "name": "Encrypt owner diagnostics and native previews",
          "if": "always()",
          "run": "bash public-build/build-support/encrypt-diagnostics.sh"
        },
        {
          "name": "Upload encrypted owner evidence",
          "if": "always()",
          "uses": "actions/upload-artifact@v4",
          "with": {
            "name": "MGControl-native-review-encrypted",
            "path": "public-output/diagnostics/build-logs.p7m",
            "if-no-files-found": "ignore",
            "retention-days": 3
          }
        }
      ]
    }
  }
}
